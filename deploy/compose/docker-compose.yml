# SATM local devnet.
#
# ============================== STATUS =====================================
# PARTIALLY VERIFIED. The SAM service definitions below were corrected against a
# REAL mesh brought up during Phase 1 spikes (see docs/SPIKE-FINDINGS.md), but
# this compose file itself has still never been executed: the Phase 0/1 machine
# has no Docker. The spikes ran the same binaries directly as processes.
#
# Known-correct from the spikes:
#   - --auto-approve-enrollment defaults to FALSE, so manual approval is the
#     default rather than something to switch on.
#   - the control plane REQUIRES --issuer even when every node uses a bootstrap
#     token and no OIDC token is ever verified.
#   - a router on a loopback devnet needs BOTH --allow-loopback and
#     --external-addr, or it announces no addresses and nodes fail with
#     "control plane returned no router addresses".
#   - nodes co-located on one host MUST get distinct libp2p --listen ports, or
#     they try to "dial to self".
#
# BLOCKER (risk R-12): bootstrap enrollment cannot complete against upstream SAM.
# sam-node/sam-router POST to /enroll/status but the server only accepts GET with
# a peer_id query param, so a node never collects its approved Biscuit. Until
# that is fixed upstream, these images will enroll-and-hang. See
# docs/SPIKE-FINDINGS.md section 6.
# ===========================================================================
#
# Roles:
#   anvil-l2   stands in for the settlement/identity L2 (Base Sepolia in testnet runs)
#   anvil-l1   stands in for the audit L1 (Ethereum Sepolia in testnet runs)
#
# Two separate chains are deliberate, not incidental: the audit plane MUST be a
# different chain from the settlement plane, or anchoring proves nothing about
# censorship resistance (SPECIFICATION.md 12.3).

name: satm-devnet

services:
  # ----------------------------------------------------------------- chains --
  anvil-l2:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - --host=0.0.0.0
      - --port=8545
      - --chain-id=31337
      - --block-time=2
    ports: ["8545:8545"]
    healthcheck:
      test:
        - CMD
        - cast
        - block-number
        - --rpc-url
        - http://127.0.0.1:8545
      interval: 5s
      timeout: 3s
      retries: 20

  anvil-l1:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - --host=0.0.0.0
      - --port=8545
      - --chain-id=31338
      # Slower blocks: L1 is intentionally the unhurried, credibly-neutral plane.
      - --block-time=12
    ports: ["8546:8545"]
    healthcheck:
      test:
        - CMD
        - cast
        - block-number
        - --rpc-url
        - http://127.0.0.1:8545
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------- trust store --
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: satm
      POSTGRES_PASSWORD: satm-devnet-only
      POSTGRES_DB: satm
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satm -d satm"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------------- ipfs --
  # Hosts agent registration files and evidence batches. Binding verification
  # (check B10) fetches from here on the devnet.
  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "5001:5001" # API
      - "8080:8080" # gateway
    volumes:
      - ipfs-data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------------- OIDC --
  # SAM's control plane authenticates enrollment via OIDC. Dex is the local
  # stand-in for a corporate IdP.
  dex:
    image: dexidp/dex:latest
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports: ["5556:5556"]
    volumes:
      - ../config/dex.yaml:/etc/dex/config.yaml:ro

  # --------------------------------------------------------- SAM mesh plane --
  # CRITICAL: --auto-approve-enrollment=false is not optional. The SATM broker
  # IS the enrollment gate; with auto-approval on, any valid OIDC identity joins
  # the mesh unbound and the entire admission control story collapses.
  # See SPECIFICATION.md 6.1.2 and ADR-0001.
  sam-control-plane:
    image: ghcr.io/google/sam-control-plane:latest
    command:
      - --bind-address=0.0.0.0:8080
      - --issuer=http://dex:5556
      - --allowed-audiences=satm-devnet
      - --auto-approve-enrollment=false
      - --admin-token-path=/etc/satm/admin-token
    ports: ["8081:8080"]
    depends_on:
      dex:
        condition: service_started
    volumes:
      - ../config/cp-admin-token:/etc/satm/admin-token:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20

  sam-router:
    image: ghcr.io/google/sam-router:latest
    command:
      - --control-plane=http://sam-control-plane:8080
      - --listen=/ip4/0.0.0.0/tcp/4501
      - --listen=/ip4/0.0.0.0/udp/4501/quic-v1
      # Verified in spike S-2 setup: without BOTH of the next two, the router
      # registers but announces ListenAddrs: [] and every node then fails with
      # "control plane returned no router addresses".
      - --allow-loopback
      - --external-addr=/ip4/127.0.0.1/tcp/4501
      - --keys-path=/data/router.key
    ports:
      - "4501:4501/tcp"
      - "4501:4501/udp"
    depends_on:
      sam-control-plane:
        condition: service_healthy
    volumes:
      - router-data:/data

volumes:
  postgres-data:
  ipfs-data:
  router-data:
