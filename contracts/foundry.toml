# Foundry configuration for SATM-authored contracts.
#
# Vendored ERC-8004 registries live under vendor/ and are compiled together with
# src/ so integration tests exercise the real registry code, not a mock.
# See ../docs/adr/0004-foundry-with-vendored-registries.md.

[profile.default]
src           = "src"
out           = "out"
test          = "test"
script        = "script"
libs          = ["dependencies"]
# vendor/ is compiled as an additional source root.
allow_paths   = ["vendor"]

solc_version  = "0.8.30"
# Cancun is REQUIRED: TreasuryNote carries agent context in transient storage
# (EIP-1153) so the mandate hook cannot be spoofed. See SPECIFICATION.md 7.3.1.
evm_version   = "cancun"

optimizer      = true
optimizer_runs = 200
# via_ir is REQUIRED, not optional: ReputationRegistryUpgradeable.giveFeedback
# takes 8 parameters and hits "stack too deep" under the legacy codegen.
via_ir         = true

bytecode_hash = "none"
cbor_metadata = false

# Fail the build on warnings we care about rather than letting them accumulate.
# deny = ["warnings"]  # enable once the tree is clean

fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.ci]
verbosity      = 3
fuzz           = { runs = 1000 }
invariant      = { runs = 256, depth = 64 }

[profile.lite]
optimizer      = false
fuzz           = { runs = 32 }

[fuzz]
runs = 256

[invariant]
runs           = 64
depth          = 32
fail_on_revert = false

[fmt]
line_length      = 110
tab_width        = 4
bracket_spacing  = false
int_types        = "long"
quote_style      = "double"
number_underscore = "thousands"
multiline_func_header = "attributes_first"

[soldeer]
remappings_generate = false
remappings_regenerate = false

[dependencies]
"@openzeppelin-contracts" = "5.1.0"
"@openzeppelin-contracts-upgradeable" = "5.1.0"
forge-std = "1.9.4"
