<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"
     aria-labelledby="amb-title amb-desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="amb-title">The Agent Mesh Binding: one document, signed twice</title>
  <desc id="amb-desc">A single canonical JSON document names the agent registry, agent id, agent
    wallet, peer id, sidecar key, mesh id, a nonce and an expiry. It is signed twice: once by the
    libp2p host key, proving control of the PeerID, and once by the ERC-8004 agentWallet using
    EIP-712, proving control of the on-chain identity. The broker verifies both signatures plus
    fifteen ordered checks. Forging a binding requires both private keys.</desc>

  <style>
    .card    { fill: #0d1117; stroke: #2f3742; }
    .raised  { fill: #151b23; stroke: #2f3742; }
    .txt     { fill: #e6edf3; }
    .muted   { fill: #9198a1; }
    .dim     { fill: #6e7681; }
    .accent  { fill: #6cb6ff; }
    .accentl { stroke: #6cb6ff; }
    .line    { stroke: #444c56; }
    .ok      { stroke: #57ab5a; }
    .okfill  { fill: #57ab5a; }
    .okbox   { fill: rgba(87,171,90,0.10); stroke: #57ab5a; }
    @media (prefers-color-scheme: light) {
      .card    { fill: #ffffff; stroke: #d1d9e0; }
      .raised  { fill: #f6f8fa; stroke: #d1d9e0; }
      .txt     { fill: #1f2328; }
      .muted   { fill: #59636e; }
      .dim     { fill: #818b98; }
      .accent  { fill: #0969da; }
      .accentl { stroke: #0969da; }
      .line    { stroke: #b7bfc7; }
      .ok      { stroke: #1a7f37; }
      .okfill  { fill: #1a7f37; }
      .okbox   { fill: rgba(26,127,55,0.08); stroke: #1a7f37; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="okfill"/>
    </marker>
  </defs>

  <!-- ============================== the document =============================== -->

  <rect class="card" x="290" y="20" width="320" height="212" rx="8" stroke-width="1"/>
  <text class="dim" x="310" y="46" font-size="10" letter-spacing="1.2">ONE CANONICAL DOCUMENT</text>
  <text class="accent" x="310" y="68" font-size="12" font-weight="600">urn:satm:binding-v1</text>

  <line class="line" x1="310" y1="80" x2="590" y2="80" stroke-width="1"/>

  <text class="muted" x="310" y="102" font-size="11">agentRegistry</text>
  <text class="txt"   x="590" y="102" font-size="11" text-anchor="end">eip155:…:0x…</text>

  <text class="muted" x="310" y="122" font-size="11">agentId</text>
  <text class="txt"   x="590" y="122" font-size="11" text-anchor="end">42</text>

  <text class="muted" x="310" y="142" font-size="11">agentWallet</text>
  <text class="txt"   x="590" y="142" font-size="11" text-anchor="end">0xf39f…2266</text>

  <text class="muted" x="310" y="162" font-size="11">peerId</text>
  <text class="txt"   x="590" y="162" font-size="11" text-anchor="end">12D3KooW…</text>

  <text class="muted" x="310" y="182" font-size="11">sidecarKey</text>
  <text class="txt"   x="590" y="182" font-size="11" text-anchor="end">ed25519:…</text>

  <text class="muted" x="310" y="202" font-size="11">meshId · nonce</text>
  <text class="txt"   x="590" y="202" font-size="11" text-anchor="end">satm-dev · 0x…</text>

  <text class="muted" x="310" y="222" font-size="11">issuedAt · expiresAt</text>
  <text class="txt"   x="590" y="222" font-size="11" text-anchor="end">RFC 3339 UTC</text>

  <!-- ============================== the two signers ============================= -->

  <!-- left: host key -->
  <rect class="raised" x="20" y="300" width="252" height="126" rx="8" stroke-width="1"/>
  <text class="accent" x="40" y="328" font-size="12" font-weight="600">libp2p host key</text>
  <text class="muted"  x="40" y="352" font-size="11">Ed25519, held by the node</text>
  <text class="dim"    x="40" y="380" font-size="10" letter-spacing="1">PROVES</text>
  <text class="txt"    x="40" y="400" font-size="12" font-weight="600">control of the PeerID</text>
  <text class="dim"    x="40" y="418" font-size="10">checks B4 · B5</text>

  <!-- right: agentWallet -->
  <rect class="raised" x="628" y="300" width="252" height="126" rx="8" stroke-width="1"/>
  <text class="accent" x="648" y="328" font-size="12" font-weight="600">ERC-8004 agentWallet</text>
  <text class="muted"  x="648" y="352" font-size="11">secp256k1 via EIP-712</text>
  <text class="dim"    x="648" y="380" font-size="10" letter-spacing="1">PROVES</text>
  <text class="txt"    x="648" y="400" font-size="12" font-weight="600">control of the agentId</text>
  <text class="dim"    x="648" y="418" font-size="10">check B9 · EOA or ERC-1271</text>

  <!-- signature arrows -->
  <line class="ok" x1="146" y1="300" x2="300" y2="238" stroke-width="2" marker-end="url(#arrow)"/>
  <line class="ok" x1="754" y1="300" x2="600" y2="238" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="okfill" x="176" y="272" font-size="10" font-weight="600">signs</text>
  <text class="okfill" x="700" y="272" font-size="10" font-weight="600">signs</text>

  <!-- ============================== the conclusion ============================== -->

  <rect class="okbox" x="290" y="452" width="320" height="46" rx="6" stroke-width="1"/>
  <text class="okfill" x="450" y="472" font-size="12" text-anchor="middle" font-weight="600">
    Forging a binding requires BOTH keys.
  </text>
  <text class="okfill" x="450" y="490" font-size="10" text-anchor="middle">
    Neither claim alone proves anything.
  </text>

  <!-- side notes explaining why one signature is not enough -->
  <text class="dim" x="20" y="472" font-size="10">A chain claim alone proves nothing</text>
  <text class="dim" x="20" y="486" font-size="10">about the node: anyone can publish</text>
  <text class="dim" x="20" y="500" font-size="10">a file naming any PeerID.</text>

  <text class="dim" x="880" y="472" font-size="10" text-anchor="end">A node claim alone proves nothing</text>
  <text class="dim" x="880" y="486" font-size="10" text-anchor="end">about the agent: any node can</text>
  <text class="dim" x="880" y="500" font-size="10" text-anchor="end">assert it is agentId 42.</text>
</svg>
