<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img"
     aria-labelledby="mj-title mj-desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="mj-title">The missing joint between SAM, ERC-8004 and ERC-8226</title>
  <desc id="mj-desc">Three technologies sit side by side. Google SAM provides peer-to-peer
    transport and identifies nodes by libp2p PeerID. ERC-8004 provides on-chain agent identity and
    identifies agents by agentId. ERC-8226 provides delegated authority keyed to an agentWallet
    address. ERC-8004 and ERC-8226 connect to each other, but nothing connects a PeerID to an
    agentId, so on-chain trust cannot gate network traffic.</desc>

  <style>
    .bg      { fill: #151b23; }
    .card    { fill: #0d1117; stroke: #2f3742; }
    .txt     { fill: #e6edf3; }
    .muted   { fill: #9198a1; }
    .dim     { fill: #6e7681; }
    .accent  { fill: #6cb6ff; }
    .line    { stroke: #444c56; }
    .ok      { stroke: #57ab5a; }
    .okfill  { fill: #57ab5a; }
    .gap     { stroke: #e5534b; }
    .gapfill { fill: #e5534b; }
    .gapbox  { fill: rgba(229,83,75,0.10); stroke: #e5534b; }
    @media (prefers-color-scheme: light) {
      .bg      { fill: #f6f8fa; }
      .card    { fill: #ffffff; stroke: #d1d9e0; }
      .txt     { fill: #1f2328; }
      .muted   { fill: #59636e; }
      .dim     { fill: #818b98; }
      .accent  { fill: #0969da; }
      .line    { stroke: #b7bfc7; }
      .ok      { stroke: #1a7f37; }
      .okfill  { fill: #1a7f37; }
      .gap     { stroke: #cf222e; }
      .gapfill { fill: #cf222e; }
      .gapbox  { fill: rgba(207,34,46,0.08); stroke: #cf222e; }
    }
  </style>

  <!-- ============================ the three standards ============================ -->

  <!-- SAM -->
  <rect class="card" x="16" y="20" width="268" height="128" rx="8" stroke-width="1"/>
  <text class="accent" x="36" y="50" font-size="13" font-weight="600">Google SAM</text>
  <text class="muted" x="36" y="72" font-size="12">P2P mesh transport</text>
  <text class="muted" x="36" y="90" font-size="12">Node identity, MCP tooling</text>
  <text class="dim"   x="36" y="120" font-size="11">identifies nodes by</text>
  <text class="txt"   x="36" y="138" font-size="12" font-weight="600">libp2p PeerID</text>

  <!-- ERC-8004 -->
  <rect class="card" x="316" y="20" width="268" height="128" rx="8" stroke-width="1"/>
  <text class="accent" x="336" y="50" font-size="13" font-weight="600">ERC-8004</text>
  <text class="muted" x="336" y="72" font-size="12">Portable agent identity</text>
  <text class="muted" x="336" y="90" font-size="12">Reputation, validation</text>
  <text class="dim"   x="336" y="120" font-size="11">identifies agents by</text>
  <text class="txt"   x="336" y="138" font-size="12" font-weight="600">agentId + agentWallet</text>

  <!-- ERC-8226 -->
  <rect class="card" x="616" y="20" width="268" height="128" rx="8" stroke-width="1"/>
  <text class="accent" x="636" y="50" font-size="13" font-weight="600">ERC-8226</text>
  <text class="muted" x="636" y="72" font-size="12">Scoped, capped delegation</text>
  <text class="muted" x="636" y="90" font-size="12">Machine-verifiable mandates</text>
  <text class="dim"   x="636" y="120" font-size="11">keyed to</text>
  <text class="txt"   x="636" y="138" font-size="12" font-weight="600">agent address</text>

  <!-- 8004 <-> 8226 : this link already exists -->
  <line class="ok" x1="584" y1="84" x2="616" y2="84" stroke-width="2"/>
  <polygon class="okfill" points="616,84 608,80 608,88"/>
  <polygon class="okfill" points="584,84 592,80 592,88"/>
  <text class="okfill" x="600" y="72" font-size="10" text-anchor="middle">connected</text>

  <!-- SAM <-> 8004 : the gap -->
  <line class="gap" x1="284" y1="84" x2="316" y2="84" stroke-width="2" stroke-dasharray="4 4"/>
  <text class="gapfill" x="300" y="72" font-size="14" text-anchor="middle" font-weight="700">?</text>

  <!-- ============================ the identifiers ============================ -->

  <rect class="bg" x="16" y="196" width="868" height="176" rx="8"/>

  <text class="dim" x="40" y="228" font-size="11" letter-spacing="1.5">THE GAP</text>

  <!-- PeerID token -->
  <rect class="card" x="56" y="252" width="250" height="72" rx="6" stroke-width="1"/>
  <text class="dim" x="72" y="278" font-size="10">NETWORK IDENTITY</text>
  <text class="txt" x="72" y="302" font-size="13" font-weight="600">12D3KooW…</text>

  <!-- agentId token -->
  <rect class="card" x="594" y="252" width="250" height="72" rx="6" stroke-width="1"/>
  <text class="dim" x="610" y="278" font-size="10">ON-CHAIN IDENTITY</text>
  <text class="txt" x="610" y="302" font-size="13" font-weight="600">eip155:…/42</text>

  <!-- the broken link between them -->
  <line class="gap" x1="306" y1="288" x2="404" y2="288" stroke-width="2" stroke-dasharray="5 5"/>
  <line class="gap" x1="496" y1="288" x2="594" y2="288" stroke-width="2" stroke-dasharray="5 5"/>

  <rect class="gapbox" x="404" y="266" width="92" height="44" rx="6" stroke-width="1"
        stroke-dasharray="4 3"/>
  <text class="gapfill" x="450" y="284" font-size="11" text-anchor="middle" font-weight="600">nothing</text>
  <text class="gapfill" x="450" y="299" font-size="11" text-anchor="middle" font-weight="600">binds these</text>

  <text class="muted" x="450" y="350" font-size="12" text-anchor="middle">
    so on-chain trust cannot gate mesh traffic, and a mandate granted to an address
  </text>
  <text class="muted" x="450" y="366" font-size="12" text-anchor="middle">
    cannot be enforced against a network connection
  </text>

  <!-- ============================ the contribution ============================ -->

  <text class="accent" x="450" y="420" font-size="13" text-anchor="middle" font-weight="600">
    The Agent Mesh Binding closes this gap.
  </text>
  <text class="dim" x="450" y="444" font-size="11" text-anchor="middle">
    Everything else in SATM composes standards that already exist.
  </text>
</svg>
