name: pages

# Publishes the explainer site at site/ to GitHub Pages.
#
# The site is plain HTML, CSS and hand-authored SVG with no build step, so this
# workflow only validates and uploads. That is deliberate: a docs site that
# depends on a toolchain is a docs site that eventually stops building.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow one concurrent deployment, but do NOT cancel a run in progress: a
# half-finished Pages deployment is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Catches unclosed tags and malformed attributes, which in hand-written
      # HTML are easy to introduce and invisible until a browser silently
      # recovers from them differently than you expected.
      - name: Check HTML and SVG are well-formed
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          failures = []

          # SVG is XML, so it must parse strictly.
          for svg in sorted(Path("site").rglob("*.svg")):
              try:
                  ET.parse(svg)
              except ET.ParseError as e:
                  failures.append(f"{svg}: {e}")

          # HTML gets a tag-balance check. void elements never close.
          VOID = {"area","base","br","col","embed","hr","img","input",
                  "link","meta","param","source","track","wbr"}

          class Balance(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.errors = []
              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append((tag, self.getpos()[0]))
              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  if not self.stack:
                      self.errors.append(f"line {self.getpos()[0]}: stray </{tag}>")
                      return
                  open_tag, line = self.stack.pop()
                  if open_tag != tag:
                      self.errors.append(
                          f"line {self.getpos()[0]}: </{tag}> closes <{open_tag}> opened on line {line}")

          for page in sorted(Path("site").rglob("*.html")):
              p = Balance()
              p.feed(page.read_text(encoding="utf-8"))
              for err in p.errors:
                  failures.append(f"{page}: {err}")
              for tag, line in p.stack:
                  failures.append(f"{page}: <{tag}> opened on line {line} is never closed")

          if failures:
              print("::error::malformed markup")
              for f in failures:
                  print(f"  {f}")
              sys.exit(1)
          print("all HTML and SVG well-formed")
          PY

      # A published site with a dead internal link is worse than no site.
      - name: Check internal links and assets resolve
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          from urllib.parse import urldefrag

          root = Path("site")
          broken = []

          for page in sorted(root.rglob("*.html")):
              html = page.read_text(encoding="utf-8")
              refs = re.findall(r'(?:href|src)="([^"]+)"', html)
              for ref in refs:
                  if ref.startswith(("http://", "https://", "mailto:", "data:", "#")):
                      continue
                  target, _ = urldefrag(ref)
                  if not target:
                      continue
                  resolved = (page.parent / target).resolve()
                  if not resolved.exists():
                      broken.append(f"{page}: {ref}")

          # In-page anchors must exist too, or the nav silently does nothing.
          for page in sorted(root.rglob("*.html")):
              html = page.read_text(encoding="utf-8")
              ids = set(re.findall(r'id="([^"]+)"', html))
              for anchor in re.findall(r'href="#([^"]+)"', html):
                  if anchor not in ids:
                      broken.append(f"{page}: #{anchor} has no matching id")

          if broken:
              print("::error::broken references")
              for b in broken:
                  print(f"  {b}")
              sys.exit(1)
          print("all internal references resolve")
          PY

  deploy:
    name: deploy
    # Only publish from main. A pull request gets validation but must not be
    # able to replace the live site.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
