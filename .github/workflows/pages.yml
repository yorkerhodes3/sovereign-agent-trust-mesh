name: pages

# Publishes the explainer site at site/ to GitHub Pages.
#
# The site is plain HTML, CSS and hand-authored SVG with no build step, so this
# workflow only validates and uploads. That is deliberate: a docs site that
# depends on a toolchain is a docs site that eventually stops building.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow one concurrent deployment, but do NOT cancel a run in progress: a
# half-finished Pages deployment is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Calls the SAME script a developer runs locally, rather than inlining a
      # copy of it. An inlined copy drifts: this workflow's first version did
      # exactly that and failed on paths the local script handled correctly.
      # The contracts workflow learned the same lesson in commit de35b0f.
      - name: Validate markup and references
        run: python3 tools/check-site.py

  deploy:
    name: deploy
    # Only publish from main. A pull request gets validation but must not be
    # able to replace the live site.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
