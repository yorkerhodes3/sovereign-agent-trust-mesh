name: contracts

# Phase 0 CI. Only the Solidity job exists today because contracts/ is the only
# component with code; Go and Python jobs land with Phases 2-3 (see PLAN.md).
# Adding empty jobs now would produce green checks that prove nothing.

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: contracts

jobs:
  build-and-test:
    name: build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show versions
        run: forge --version

      # Dependencies are resolved from soldeer.lock, not from a range, so a
      # transitive bump cannot silently change what we compiled and tested.
      - name: Install dependencies (locked)
        run: forge soldeer install

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci

      # The vendored ERC-8004 sources must stay byte-identical to the pinned
      # upstream commit. If someone edits vendor/ instead of extending src/,
      # this fails and tells them why.
      - name: Verify vendored sources are unmodified
        run: |
          set -euo pipefail
          SHA=$(grep -oP '(?<=^commit: ).*' vendor/erc8004/UPSTREAM)
          echo "Pinned upstream commit: $SHA"
          fail=0
          for f in IdentityRegistryUpgradeable ReputationRegistryUpgradeable \
                   ValidationRegistryUpgradeable ERC1967Proxy MinimalUUPS; do
            url="https://raw.githubusercontent.com/erc-8004/erc-8004-contracts/$SHA/contracts/$f.sol"
            if ! curl -sSfL "$url" -o "/tmp/$f.sol"; then
              echo "::error::could not fetch $f.sol from pinned commit"
              fail=1
              continue
            fi
            if ! diff -u "/tmp/$f.sol" "vendor/erc8004/$f.sol"; then
              echo "::error::vendor/erc8004/$f.sol has been modified."
              echo "vendor/ must mirror upstream exactly. Put SATM changes in src/."
              fail=1
            fi
          done
          exit $fail

  gas-report:
    name: gas snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: forge soldeer install
        working-directory: contracts
      - run: forge snapshot --check || echo "::notice::gas snapshot drifted; run 'forge snapshot' locally"
        working-directory: contracts
        continue-on-error: true
