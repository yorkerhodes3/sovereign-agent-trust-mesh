name: contracts

# Phase 0 CI. Only the Solidity job exists today because contracts/ is the only
# component with code; Go and Python jobs land with Phases 2-3 (see PLAN.md).
# Adding empty jobs now would produce green checks that prove nothing.

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: contracts

jobs:
  build-and-test:
    name: build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show versions
        run: forge --version

      # Dependencies are resolved from soldeer.lock, not from a range, so a
      # transitive bump cannot silently change what we compiled and tested.
      - name: Install dependencies (locked)
        run: forge soldeer install

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci

      # The vendored ERC-8004 sources must stay byte-identical to the pinned
      # upstream commit. If someone edits vendor/ instead of extending src/,
      # this fails and tells them why.
      #
      # Calls the SAME script developers run locally (`make verify-vendor`)
      # rather than a copy of it. An earlier version inlined the logic here and
      # promptly drifted: the inline regex mishandled the aligned whitespace in
      # UPSTREAM and built a malformed URL, which the local checker did not.
      - name: Verify vendored sources are unmodified
        working-directory: .
        run: bash tools/verify-vendor.sh

  gas-report:
    name: gas snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Install dependencies (locked)
        run: forge soldeer install
        working-directory: contracts
      # A committed .gas-snapshot makes this a real check: an unexplained gas
      # change shows up in review instead of drifting silently. Non-blocking,
      # because a legitimate change should not require a second push to land.
      - name: Compare against committed snapshot
        working-directory: contracts
        run: forge snapshot --check
        continue-on-error: true
